services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - shared_storage:/app/storage_data
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/peblo
      - ARTWORK_STORAGE_DIR=/app/storage_data/artworks
      - ARTWORK_REPORT_PATH=/app/storage_data/validation_report_artwork.json
      - VALIDATION_REPORT_PATH=/app/storage_data/validation_report.json
      - CATALOGUE_PATH=/app/storage_data/catalogue.json
    depends_on:
      - db

  cms:
    build: ./cms-ui
    ports:
      - "3000:3000"
    volumes:
      - ./cms-ui:/app
      - /app/node_modules
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL}

  viewer:
    build: ./viewer-ui
    ports:
      - "3001:3000"
    volumes:
      - ./viewer-ui:/app
      - /app/node_modules

volumes:
  postgres_data:
  shared_storage: